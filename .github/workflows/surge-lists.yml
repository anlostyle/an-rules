name: Build Surge rule lists

on:
  schedule:
    - cron: "17 21 * * *"  # 每天北京时间 05:17
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "singbox/user-*.json"
      - "scripts/build_surge_lists.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_surge_lists.py
      - name: Commit changes
        run: |
          git add surge/unified
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Surge rule lists"
          git push
